name: Bug
description: Report a defect in the CLI, agent, dashboard, or installer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, node roles, and operating systems. Do not include join keys, API tokens, or Hugging Face tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
