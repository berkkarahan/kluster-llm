name: Feature
description: Suggest a change to cluster setup, inference, or the dashboard
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change, and which platforms does it affect?
    validations:
      required: true
