[package]
name = "kllm-native"
version = "0.1.0"
edition = "2021"
description = "Native HW probe, split planner, and process supervision for kllm"
license = "MIT"

[lib]
name = "kllm_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sysinfo = "0.33"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.57", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }

[dev-dependencies]
tempfile = "3"
