[package]
name = "kllm-native"
version = "0.1.0"
edition = "2021"
description = "Native HW probe, split planner, and process supervision for kllm"
license = "MIT"

[features]
default = ["python-bindings"]
python-bindings = ["dep:pyo3"]
extension-module = ["python-bindings", "pyo3/extension-module"]
network-helper = []

[lib]
name = "kllm_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "kllm-network-helper"
path = "src/bin/kllm-network-helper.rs"
required-features = ["network-helper"]

[dependencies]
pyo3 = { version = "0.29", optional = true }
socket2 = { version = "0.5", features = ["all"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sysinfo = "0.39"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.23"
ed25519-dalek = "3"
sha2 = "0.10"
regex = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_NetworkManagement_Ndis", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = { version = "0.3", default-features = false, features = ["std", "MTLDevice"] }

[dev-dependencies]
tempfile = "3"
