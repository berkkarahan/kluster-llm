[package]
name = "kllm-native"
version = "0.1.0"
edition = "2021"
description = "Native HW probe, split planner, and process supervision for kllm"
license = "MIT"

[lib]
name = "kllm_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sysinfo = "0.33"

[dev-dependencies]
tempfile = "3"
