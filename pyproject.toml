[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "kllm"
version = "0.1.0"
description = "Cross-platform cluster router CLI for Kluster LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kluster LLM" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "zeroconf>=0.132",
    "huggingface_hub>=0.24",
    "psutil>=5.9",
    "pydantic>=2.7",
    "cryptography>=44",
    "websockets>=15",
]

[project.urls]
Repository = "https://github.com/berkkarahan/kluster-llm"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-xdist>=3.6", "ruff>=0.6", "mypy>=1.11"]

[dependency-groups]
dev = [
    "maturin>=1.7,<2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
kllm = "kllm.cli:main"
kllm-agent = "kllm.agent.__main__:main"

[tool.maturin]
manifest-path = "crates/kllm-native/Cargo.toml"
module-name = "kllm._native"
python-source = "src"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n 4 --dist=loadfile"
markers = [
    "unit: deterministic test with controlled external dependencies",
    "integration: real local transport, persistence, process, native, or browser boundary",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["kllm"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
